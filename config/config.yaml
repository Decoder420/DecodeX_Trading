project:
  name: "Quantitative Signal Platform - Part 1"
  version: "1.0.0"
  random_seed: 42
  environment: "development"

market:
  timezone: "Asia/Kolkata"
  session:
    market_open: "09:15"
    market_close: "15:30"
  holiday_calendar_path: "config/holidays.yaml"

data:
  active_timeframe: "1d"         # Options: "1d" (primary), "15m" (secondary)
  supported_timeframes: ["1d", "15m"]
  provider:
    primary: "angelone"          # Options: "angelone", "yfinance", "upstox"
    fallback: "yfinance"
    rate_limits:
      max_requests_per_second: 3
      retry_attempts: 4
      retry_backoff_factor: 2.0
      intraday_chunk_days: 30    # Maximum days per historical request chunk for intraday
    angelone:
      scrip_master_url: "https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json"
      cache_path: "data/cache/angel_scrip_master.json"
      cache_ttl_hours: 24
  storage:
    backend: "duckdb"            # Options: "duckdb", "sqlite"
    duckdb_path: "data/market_data.duckdb"
    sqlite_path: "data/market_data.db"

